<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>空腹抽血提醒</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
    background: #fff7e6; color: #1a1a1a;
    padding: 28px 20px 40px;
    display: flex; flex-direction: column; align-items: center;
  }
  .title { font-size: 40px; font-weight: 900; letter-spacing: 2px; color: #c0392b; margin-bottom: 26px; text-align: center; }
  .card { width: 100%; max-width: 760px; background: #fff; border: 4px solid #1a1a1a; border-radius: 18px; padding: 34px 28px; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  .msg p { font-size: 44px; font-weight: 900; line-height: 1.55; letter-spacing: 1px; margin-bottom: 22px; text-align: center; }
  .msg p:last-child { margin-bottom: 0; }
  .controls { margin-top: 28px; width: 100%; max-width: 760px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .controls button {
    font-size: 26px; font-weight: 800; padding: 16px 26px; border: none; border-radius: 14px;
    cursor: pointer; min-width: 150px; color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  .controls button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  #btnPlay { background: #27ae60; }
  #btnPause { background: #f39c12; }
  #btnStop { background: #c0392b; }
  #btnVoice { background: #2980b9; }
  .hint { margin-top: 18px; font-size: 22px; font-weight: 700; color: #7f8c8d; text-align: center; }

  /* 自动播放被拦截时的全屏引导遮罩 */
  #mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.78);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 999; color: #fff; text-align: center; padding: 30px;
  }
  #mask.show { display: flex; }
  #mask .big { font-size: 64px; font-weight: 900; margin-bottom: 24px; }
  #mask .sub { font-size: 30px; font-weight: 700; line-height: 1.6; }
  #mask .tap { margin-top: 40px; font-size: 34px; font-weight: 900; background: #27ae60; padding: 22px 50px; border-radius: 18px; box-shadow: 0 6px 0 rgba(0,0,0,.3); }

  @media (max-width: 600px) {
    .msg p { font-size: 33px; }
    .title { font-size: 30px; }
    .controls button { font-size: 22px; padding: 14px 18px; min-width: 130px; }
  }
</style>
</head>
<body>
  <h1 class="title">空腹抽血提醒</h1>
  <div class="card">
    <div class="msg">
      <p>大爷大妈，您好！明天您要做空腹抽血，千万别忘了两件最重要的事。</p>
      <p>第一，今天晚上八点以后，就别再吃任何东西了，明早的早饭绝对不能吃。</p>
      <p>第二，如果您平时有吃降压药，明天早上药还是得吃，喝一小口白开水咽下去就行，千万别停药。</p>
      <p>明早出门前，记得带好身份证、医保卡和单子。您现在可以让家里人帮您设个明早的起床闹钟。祝您明天检查顺利！</p>
    </div>
  </div>

  <div class="controls">
    <button id="btnPlay">开始朗读</button>
    <button id="btnPause">暂停 / 继续</button>
    <button id="btnStop">停止</button>
    <button id="btnVoice">切换男声 / 女声</button>
  </div>
  <div class="hint" id="hint">正在尝试自动播放……</div>

  <!-- 预生成的音频文件，放在同目录 -->
  <audio id="a-female" src="audio_female.mp3" preload="auto" playsinline webkit-playsinline></audio>
  <audio id="a-male" src="audio_male.mp3" preload="auto" playsinline webkit-playsinline></audio>

  <!-- 自动播放被拦截时的全屏引导 -->
  <div id="mask">
    <div class="big">听见了吗？</div>
    <div class="sub">如果还没有声音，<br>点一下屏幕就能大声朗读</div>
    <div class="tap">点我播放</div>
  </div>

<script>
(function () {
  var female = document.getElementById('a-female');
  var male = document.getElementById('a-male');
  var current = female;
  var useMale = false;
  var playing = false;

  female.volume = 1.0;
  male.volume = 1.0;

  function setHint(t) { document.getElementById('hint').textContent = t; }
  function showMask() { document.getElementById('mask').classList.add('show'); }
  function hideMask() { document.getElementById('mask').classList.remove('show'); }

  function tryPlay() {
    if (playing) return;
    var p = current.play();
    if (p && p.then) {
      p.then(function () { playing = true; hideMask(); setHint('正在大声朗读中……（音量已最大）'); })
       .catch(function () { showMask(); setHint('点一下屏幕即可开始朗读'); });
    }
  }

  // 1) 页面加载立即尝试自动播放
  window.addEventListener('load', function () { setTimeout(tryPlay, 200); });

  // 2) 微信内置浏览器自动播放 hack
  function wxHack() {
    if (typeof WeixinJSBridge !== 'undefined') {
      WeixinJSBridge.invoke('getNetworkType', {}, function () { tryPlay(); });
    }
  }
  if (document.addEventListener) {
    document.addEventListener('WeixinJSBridgeReady', wxHack, false);
    document.addEventListener('WeixinJSBridgeReady', tryPlay, false);
  }
  wxHack();

  // 3) 兜底：任意一次触摸/点击即播放（并隐藏遮罩）
  function onGesture() {
    hideMask();
    if (!playing) { tryPlay(); }
    document.removeEventListener('pointerdown', onGesture);
    document.removeEventListener('touchstart', onGesture);
  }
  document.addEventListener('pointerdown', onGesture);
  document.addEventListener('touchstart', onGesture);

  // 播放结束
  function onEnded() { playing = false; setHint('朗读完成，可点「开始朗读」重听'); }
  female.addEventListener('ended', onEnded);
  male.addEventListener('ended', onEnded);

  // 控制按钮
  document.getElementById('btnPlay').addEventListener('click', function () {
    hideMask(); playing = false; current.currentTime = 0; tryPlay();
  });
  document.getElementById('btnPause').addEventListener('click', function () {
    if (!current.paused) { current.pause(); setHint('已暂停，点「暂停 / 继续」继续'); }
    else { current.play().catch(function () { showMask(); }); setHint('继续朗读……'); }
  });
  document.getElementById('btnStop').addEventListener('click', function () {
    current.pause(); current.currentTime = 0; playing = false; setHint('已停止');
  });
  document.getElementById('btnVoice').addEventListener('click', function () {
    var wasPlaying = !current.paused;
    current.pause(); current.currentTime = 0;
    useMale = !useMale;
    current = useMale ? male : female;
    setHint('已切换为' + (useMale ? '男声' : '女声'));
    if (wasPlaying) { playing = false; tryPlay(); }
  });
})();
</script>
</body>
</html>
